apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

import groovy.json.JsonSlurper
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// versionName is the Vitals version (root package.json); versionCode = major*10000 + minor*100 + patch, so it rises
// with every release and the phone accepts the update (.jobs contract with the release workflow).
def vitalsVersion = new JsonSlurper().parse(file('../../../../package.json')).version as String
def vitalsVersionCode = vitalsVersion.tokenize('.-')[0..2].collect { it as int }.with { it[0] * 10000 + it[1] * 100 + it[2] }

android {
    namespace = "desi.creative.vitals"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "desi.creative.vitals"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vitalsVersionCode
        versionName vitalsVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // The web build's service worker (sw.js) stays out: the APK already holds every file, and a service worker in the
            // WebView would keep serving the previous version's files after an app update.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!sw.js'
        }
    }
    // Icons, notification icon and the animated splash: generated by L-BRAND's scripts/brand into apps/android/brand.
    sourceSets {
        main {
            res.srcDirs += ['../../brand/res']
        }
    }
    // The release workflow signs the unsigned APK afterwards (scripts/release/sign-apk.sh). A local signed build
    // points at a keystore file through the environment; nothing about the key lives in the project.
    def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
    if (keystoreFile) {
        signingConfigs {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Same JVM level as capacitor.build.gradle's compileOptions (Kotlin 2 refuses a mismatch).
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
