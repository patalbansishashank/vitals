# Production deployment: called once by Release after validation, or explicitly dispatched with its own gate.
name: Deploy

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      validated:
        required: false
        type: boolean
        default: false
    secrets:
      NETLIFY_SITE_ID:
        required: true
      NETLIFY_AUTH_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  source:
    name: Resolve deployment source
    if: github.repository == 'patalbansishashank/vitals' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      label: ${{ steps.source.outputs.label }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Check immutable source and stable release policy
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          LABEL: ${{ inputs.release_tag || github.ref_name }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ -n "$REQUESTED_SHA" ] && [ "$REQUESTED_SHA" != "$SHA" ]; then
            echo "::error::Reusable deployment must name the exact commit SHA"
            exit 1
          fi
          if [[ "$LABEL" == v*-* ]]; then
            echo "::error::Candidate tags cannot deploy to production"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate manually requested deployment
    needs: source
    if: ${{ !inputs.validated }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  deploy:
    name: Build and deploy to production
    # Production deploys come from the public repository only (the private archive keeps this workflow disabled too).
    needs: [source, validate]
    if: ${{ always() && needs.source.result == 'success' && (needs.validate.result == 'success' || (inputs.validated && needs.validate.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      # package.json has no "packageManager" field, so the pnpm major is pinned here.
      # If one is added later, drop `version` (the action fails when both are set and disagree).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # netlify-cli has two binaries (netlify, ntl), so pnpm 11 needs `--package=netlify-cli@27 dlx netlify`
      # (`pnpm dlx netlify-cli@27` fails with ERR_PNPM_DLX_MULTIPLE_BINS). This step also warms the dlx cache
      # so the deploy step's JSON output is not mixed with install logs.
      - name: Install Netlify CLI
        run: pnpm --package=netlify-cli@27 dlx netlify --version

      # dist/ was built above, so --no-build stops the CLI from running the build again.
      # netlify.toml (redirects, headers) is still applied to the deploy. `--filter vitals` names the app package:
      # the repo is a pnpm workspace (vitals + packages/companion) and the CLI refuses to guess (v0.2.0 deploy failure).
      - name: Deploy to Netlify (production)
        env:
          DEPLOY_LABEL: ${{ needs.source.outputs.label }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          pnpm --reporter=silent --package=netlify-cli@27 dlx netlify deploy --prod --no-build --dir=dist \
            --filter vitals --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "Release ${DEPLOY_LABEL}" --json > "$RUNNER_TEMP/deploy.json"
          jq '{deploy_id, site_name, url, deploy_url, logs}' "$RUNNER_TEMP/deploy.json"
          {
            echo "### Deployed ${DEPLOY_LABEL} to production"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Site | $(jq -r '.url' "$RUNNER_TEMP/deploy.json") |"
            echo "| Deploy | $(jq -r '.deploy_url' "$RUNNER_TEMP/deploy.json") |"
            echo "| Deploy id | \`$(jq -r '.deploy_id' "$RUNNER_TEMP/deploy.json")\` |"
            echo "| Netlify log | $(jq -r '.logs' "$RUNNER_TEMP/deploy.json") |"
          } >> "$GITHUB_STEP_SUMMARY"
