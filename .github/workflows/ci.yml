# Credential-free validation. Every discovered test runs once; artifact storage is optional diagnostics only.
name: Validate
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'serial' && 'Serial performance diagnostic' || 'Validate' }}

on:
  pull_request:
  push:
    branches: [main, 'wp/r063-int']
  workflow_dispatch:
    inputs:
      scope:
        description: Full validation, or a serial-only diagnostic that cannot produce a full validation receipt
        type: choice
        required: true
        default: all
        options: [all, serial]
      serial_runner:
        description: Timing reference or x64 comparison for a serial diagnostic; full validation uses ARM
        type: choice
        required: true
        default: ubuntu-24.04-arm
        options: [ubuntu-24.04-arm, ubuntu-24.04]
  workflow_call:
    inputs:
      ref:
        description: Exact source ref to validate (release callers pass their immutable commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pin images; use the standard ARM pool as the absolute timing reference. The x64 pool
# varies by CPU generation even on one image. Core software and Android remain on x64.
# Image/reference migrations require an explicit validation review (VALIDATION_ACCOUNTING.md).
# A manual serial diagnostic saves minutes but skips the aggregate: it is never a release gate.
jobs:
  core-1:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'serial'
    name: Tests (core-1)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the exact source-bound partition
        run: node scripts/validation/release-gate.mjs --partition core-1 --check
      # Job outputs, not uploaded artifacts, carry the complete compressed inventory/results to the aggregate gate.
      - name: Export the bounded validation receipt
        id: receipt
        if: always()
        run: node scripts/validation/emit-receipt.mjs

  core-2:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'serial'
    name: Tests (core-2)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the exact source-bound partition
        run: node scripts/validation/release-gate.mjs --partition core-2
      # Job outputs, not uploaded artifacts, carry the complete compressed inventory/results to the aggregate gate.
      - name: Export the bounded validation receipt
        id: receipt
        if: always()
        run: node scripts/validation/emit-receipt.mjs

  core-3:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'serial'
    name: Tests (core-3)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the exact source-bound partition
        run: node scripts/validation/release-gate.mjs --partition core-3
      # Job outputs, not uploaded artifacts, carry the complete compressed inventory/results to the aggregate gate.
      - name: Export the bounded validation receipt
        id: receipt
        if: always()
        run: node scripts/validation/emit-receipt.mjs

  core-4:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'serial'
    name: Tests (core-4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the exact source-bound partition
        run: node scripts/validation/release-gate.mjs --partition core-4
      # Job outputs, not uploaded artifacts, carry the complete compressed inventory/results to the aggregate gate.
      - name: Export the bounded validation receipt
        id: receipt
        if: always()
        run: node scripts/validation/emit-receipt.mjs

  serial:
    name: Tests (serial)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'serial' && inputs.serial_runner == 'ubuntu-24.04' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the benchmark runtime environment
        run: |
          lscpu
          node - <<'NODE'
          const os = require('node:os');
          console.log(JSON.stringify({ node: process.version, v8: process.versions.v8,
            arch: process.arch, kernel: os.release(), cpuModel: os.cpus()[0]?.model,
            reportedMHz: os.cpus()[0]?.speed, availableCpus: os.availableParallelism(),
            memoryBytes: os.totalmem(), load: os.loadavg() }));
          NODE
      - name: Run the exact source-bound partition
        run: node scripts/validation/release-gate.mjs --partition serial
      # Job outputs, not uploaded artifacts, carry the complete compressed inventory/results to the aggregate gate.
      - name: Export the bounded validation receipt
        id: receipt
        if: always()
        run: node scripts/validation/emit-receipt.mjs

  software:
    name: Software and validation accounting
    needs: [core-1, core-2, core-3, core-4, serial, android-tests]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.scope != 'serial')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Account for every test and require matching immutable source receipts
        env:
          CORE_1_RECEIPT: ${{ needs['core-1'].outputs.receipt }}
          CORE_2_RECEIPT: ${{ needs['core-2'].outputs.receipt }}
          CORE_3_RECEIPT: ${{ needs['core-3'].outputs.receipt }}
          CORE_4_RECEIPT: ${{ needs['core-4'].outputs.receipt }}
          SERIAL_RECEIPT: ${{ needs.serial.outputs.receipt }}
          NATIVE_RECEIPT: ${{ needs['android-tests'].outputs.receipt }}
          CORE_1_RESULT: ${{ needs['core-1'].result }}
          CORE_2_RESULT: ${{ needs['core-2'].result }}
          CORE_3_RESULT: ${{ needs['core-3'].result }}
          CORE_4_RESULT: ${{ needs['core-4'].result }}
          SERIAL_RESULT: ${{ needs['serial'].result }}
          NATIVE_RESULT: ${{ needs['android-tests'].result }}
        run: node scripts/validation/aggregate-ci.mjs
      - name: Install lockfile-pinned Chromium in this runner
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Exercise real mobile touch gestures
        run: pnpm test:browser
        timeout-minutes: 3
      - run: pnpm build
      - name: Optional archive of validation diagnostics
        id: diagnostics
        if: always() && vars.VITALS_ARCHIVE_VALIDATION == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: validation-diagnostics
          path: |
            .vitest/release/*.json
            .vitest/browser/results.json
            .vitest/browser/failure.png
          if-no-files-found: warn
          retention-days: 3
      - name: Report unavailable artifact storage explicitly
        if: always() && steps.diagnostics.outcome == 'failure'
        run: echo "::warning::Optional diagnostic upload failed. Validation receipts and browser results remain in job logs; no test gate depends on artifact storage."

  android-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'serial'
    name: Android unit tests (unsigned)
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    # Independent source checkout/build: unavailable artifact storage cannot block or substitute native validation.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build this checkout's web assets for native validation
        run: pnpm build
      - run: pnpm --filter @vitals/android run sync
      - name: Record native test source after build and sync
        id: native_source
        run: node scripts/validation/native-receipt.mjs start
      - name: Gauge engine and Android app unit tests
        id: native_tests
        working-directory: apps/android/android
        run: ./gradlew :gauge:testDebugUnitTest :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Account for native skips and failures
        if: always() && steps.native_source.outcome == 'success'
        run: |
          python3 -B -m unittest discover -s scripts/validation -p "*_test.py"
          pnpm test:native-accounting
      - name: Finish the source-bound native receipt
        if: always()
        env:
          VITALS_NATIVE_TEST_OUTCOME: ${{ steps.native_tests.outcome }}
        run: node scripts/validation/native-receipt.mjs finish
      - name: Export the bounded native receipt
        id: receipt
        if: always()
        run: node scripts/validation/emit-receipt.mjs
      - name: Optional archive of native diagnostics
        id: diagnostics
        if: always() && vars.VITALS_ARCHIVE_VALIDATION == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: validation-android-tests
          path: |
            apps/android/android/**/build/test-results/**/*.xml
            .vitest/release/native.json
          if-no-files-found: warn
          retention-days: 3
      - name: Report unavailable artifact storage explicitly
        if: always() && steps.diagnostics.outcome == 'failure'
        run: echo "::warning::Optional native diagnostic upload failed. Native test counts and explicit skipped cases remain in job logs."
